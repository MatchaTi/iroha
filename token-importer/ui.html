<textarea id="t" style="width:100%;height:150px" placeholder="Paste tokens JSON di sini"></textarea>
<button id="b" style="margin-top:8px">Import</button>
<script>
  document.getElementById("b").onclick = function () {
    try {
      var data = JSON.parse(document.getElementById("t").value);
      parent.postMessage({ pluginMessage: data }, "*");
    } catch (e) {
      alert("JSON tidak valid");
    }
  };
</script>
